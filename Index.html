
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LernHeld</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f6fc;
  color: #26364a;
}
header {
  background: #3978c8;
  color: white;
  padding: 28px 20px;
  text-align: center;
}
header h1 { margin: 0; font-size: 34px; }
header p { margin-bottom: 0; }
main { max-width: 700px; margin: auto; padding: 22px; }
h2 { color: #315f99; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.tile {
  background: white;
  border-radius: 18px;
  padding: 22px 10px;
  text-align: center;
  box-shadow: 0 3px 12px #00000010;
  font-size: 17px;
  font-weight: bold;
}
.tile span { display: block; font-size: 34px; margin-bottom: 10px; }
footer { text-align: center; padding: 25px; color: #718096; }
</style>
</head>
<body>
<header>
  <h1>⭐ LernHeld</h1>
  <p>Einfach lernen. Besser verstehen.</p>
</header>
<main>
  <h2>Hallo, LernHeld! 👋</h2>
  <p>Was möchtest du heute lernen?</p>
  <div class="grid">
    <div class="tile"><span>📸</span>Heft fotografieren</div>
    <div class="tile"><span>📚</span>Lernzettel</div>
    <div class="tile"><span>🧠</span>Mindmaps</div>
    <div class="tile"><span>🎴</span>Lernkarten</div>
    <div class="tile"><span>🎯</span>Quiz</div>
    <div class="tile"><span>🔊</span>Vorlesen</div>
    <div class="tile"><span>🇬🇧</span>Englisch</div>
    <div class="tile"><span>👨‍👩‍👦</span>Elternbereich</div>
  </div>
</main>
<footer>LernHeld 1.0 · Gemeinsam stark lernen</footer>
</body>
</html>
